name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # 用 setup-gradle 而非 ./gradlew：本地 wrapper 指向腾讯云镜像，
      # 这里直接按版本号装官方发行版，海外机器上更快也更稳。
      - name: 安装 Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: 构建
        run: |
          set -o pipefail
          if ! gradle build --no-daemon --stacktrace 2>&1 | tee build.log; then
            echo "::warning::首次构建失败，清理后强制刷新依赖重试一次"
            gradle --stop || true
            gradle build --no-daemon --stacktrace --refresh-dependencies 2>&1 | tee build.log
          fi

      # 构建挂了也要能远程定位问题：把日志尾部写进运行摘要（网页可直接看到）
      - name: 失败时导出日志摘要
        if: failure()
        run: |
          {
            echo '### 构建失败，日志尾部如下'
            echo '```'
            tail -n 80 build.log 2>/dev/null || echo '(build.log 不存在，可能是更早的步骤失败)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 整理产物（去掉 sources jar）
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          ls -lh dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: smoothcraft${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.jar
          draft: false
          prerelease: false
          make_latest: true
