name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 用 setup-gradle 而非 ./gradlew：本地 wrapper 指向腾讯云镜像，
      # 这里直接按版本号装官方发行版，海外机器上更快也更稳。
      - name: 安装 Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: 构建
        run: gradle build --no-daemon --stacktrace

      - name: 整理产物（去掉 sources jar）
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          ls -lh dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: smoothcraft${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: dist/*.jar
          draft: false
          prerelease: false
          make_latest: true
